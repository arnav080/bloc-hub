version: "1.0"
metadata:
  name: "Qwen 35B MoE (4060 Ti Optimized)"
  description: "Optimized for 8GB VRAM with MoE expert offloading."
model:
  repo: "bartowski/Qwen2.5-32B-Instruct-GGUF" # Using a close representative repo
  file: "Qwen2.5-32B-Instruct-Q4_K_S.gguf"
  engine: "llama.cpp"
engine_config:
  ctx_size: 32768
  gpu_layers: 40 # Heuristic for 8GB with MoE
  flash_attn: true
  kv_cache_quant: "q8_0"
  cpu_threads: 8
  expert_offload: true # The "MoE expert offload to CPU" flag
scheduling:
  max_concurrency: 1
  policy: "fair-round-robin"
network:
  port: 8000
  public: true
